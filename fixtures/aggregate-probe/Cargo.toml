[package]
name = "aggregate-probe"
version = "0.7.0"
edition = "2021"
publish = false
description = "RETURNS-46 review probes: two static children of one type, dynamic under dynamic, recursive and mutually recursive children, `Self` children, opaque children, instance names, memory and cost"

[dependencies]
plexus-macros = { path = "../.." }
plexus-core = { path = "../../../plexus-core" }
plexus-client = { path = "../../plexus-client" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "1.1", features = ["derive"] }
futures = "0.3"
async-stream = "0.3"
# What `#[plexus_macros::activation]`'s server half expands to.
async-trait = "0.1"
jsonrpsee = { version = "0.26", features = ["server", "macros"] }
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "v5"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
