[package]
name = "conformance"
version = "0.7.0"
edition = "2021"
publish = false
description = "RETURNS-7 fixture: one activation per signature form, and the schema, wire and aggregate JSON every generator must reproduce"

# Not a workspace member yet: it needs the macro to understand the 0.7
# signature forms, which RETURNS-8 builds. RETURNS-8 adds it to the
# plexus-macros workspace and serves it against `expected/`.
#
# The activation's schema `version` is this crate's version
# (`env!("CARGO_PKG_VERSION")`), so `expected/schema.json` says "0.7.0".

[dependencies]
plexus-macros = { path = "../.." }
plexus-core = { path = "../../../plexus-core" }
plexus-client = { path = "../../plexus-client" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "1.1", features = ["derive"] }
futures = "0.3"
async-stream = "0.3"
# What `#[plexus_macros::activation]`'s server half expands to.
async-trait = "0.1"
jsonrpsee = { version = "0.26", features = ["server", "macros"] }
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "v5"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
