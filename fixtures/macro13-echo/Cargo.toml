[package]
name = "macro13-echo"
version = "0.0.0"
edition = "2021"
publish = false
description = "MACRO-13 fixture: an activation crate with a `server` feature, gated by the macro with no `server_cfg` written"

# The crate declares a `server` feature, so `#[plexus_macros::activation]`
# gates its server half on it without being told; `--no-default-features`
# builds the trait and the client with no plexus-core in the tree.
# `HostActivation` overrides the gate with `server_cfg = "feature = \"host\""`.
[features]
default = ["server", "host"]
server = [
    "dep:plexus-core",
    "dep:async-trait",
    "dep:jsonrpsee",
    "dep:tokio",
    "dep:uuid",
    "dep:serde_json",
]
host = ["server"]

[dependencies]
plexus-macros = { path = "../.." }
plexus-client = { path = "../../plexus-client" }
serde = { version = "1.0", features = ["derive"] }
futures = "0.3"
schemars = { version = "1.1", features = ["derive"] }

plexus-core = { path = "../../../plexus-core", optional = true }
async-trait = { version = "0.1", optional = true }
jsonrpsee = { version = "0.26", features = ["server", "macros"], optional = true }
tokio = { version = "1.0", features = ["full"], optional = true }
uuid = { version = "1.0", features = ["v4", "v5"], optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
