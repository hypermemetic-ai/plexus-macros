[package]
name = "aggregate-tree"
version = "0.7.0"
edition = "2021"
publish = false
description = "RETURNS-46 fixture: a tree of activations — a static child with a static child of its own, and a dynamic child — and the nested aggregate JSON at every level"

# Beside the conformance fixture, not in it: `fixtures/conformance/expected/`
# is a contract every generator reads (plexus-protocol, synapse's IR, the TS
# and Rust codegen), and children would move its schema's hash and so every
# frame's `plexus_hash`. This fixture's contract is the aggregate up the tree.

[dependencies]
plexus-macros = { path = "../.." }
plexus-core = { path = "../../../plexus-core" }
plexus-client = { path = "../../plexus-client" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "1.1", features = ["derive"] }
futures = "0.3"
async-stream = "0.3"
# What `#[plexus_macros::activation]`'s server half expands to.
async-trait = "0.1"
jsonrpsee = { version = "0.26", features = ["server", "macros"] }
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "v5"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
