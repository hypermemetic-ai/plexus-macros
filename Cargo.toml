[package]
name = "plexus-macros"
description = "#[service]: a Rust module becomes a WebAssembly component, its WIT written from the code."
edition = "2024"
version = "0.0.0"
license = "MIT"
publish = false

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
heck = "0.5"
sha2 = "0.10"
