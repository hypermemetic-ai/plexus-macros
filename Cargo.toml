[package]
name = "plexus-macros"
description = "#[activation]: a Rust module becomes a WebAssembly component, its WIT written from the code."
edition = "2024"
version = "0.0.0"
license = "MIT"
publish = false

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
heck = "0.5"
plexus-ir = { path = "../plexus-ir" }
plexus-gen = { path = "../plexus-gen" }
serde_json = "1"

[dev-dependencies]
similar = "2"
