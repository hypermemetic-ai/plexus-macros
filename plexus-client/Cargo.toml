[package]
name = "plexus-client"
version = "0.7.0"
edition = "2021"
license = "MIT"
description = "wasm-safe client runtime for Plexus RPC: the wire envelope, the Transport trait, and typed event decoding"

# The whole point of this crate: a wasm32 consumer can depend on it without
# dragging in tokio/jsonrpsee/rmcp. Every dependency below builds for
# wasm32-unknown-unknown. Adding a dependency that does not is a regression —
# `cargo build -p plexus-client --target wasm32-unknown-unknown` is the gate.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-core = { version = "0.3", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# RETURNS-4: `JsonSchema` for `Note` and `RemoteError`, so a server can
# describe them. OPTIONAL (feature `schema`): a wasm32 consumer that only
# decodes needs none of it. plexus-core enables it.
schemars = { version = "1.1", optional = true }

# MACRO-6: everything below is a WebSocket backend and is OPTIONAL. The
# default feature set stays the four dependencies above.
futures-channel = { version = "0.3", default-features = false, features = [
    "std",
], optional = true }

# ws-native
tokio = { version = "1.0", features = ["rt"], optional = true }
tokio-tungstenite = { version = "0.30", optional = true }

# ws-web
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "CloseEvent",
    "Event",
    "MessageEvent",
    "WebSocket",
] }

# MACRO-6: the WebSocket JSON-RPC transport, one type behind two backends.
#
# `default = []` is load-bearing, not decoration: a wasm32 consumer that says
# `plexus-client = "0.7"` must get the four-dependency core and nothing else,
# and `--no-default-features` must have no tokio, jsonrpsee or schemars
# anywhere in the tree. Both backends expose the same
# `WsTransport::connect(url, hub)`.
[features]
default = []
# RETURNS-4: `schemars::JsonSchema` impls for the wire vocabulary (`Note`,
# `RemoteError`, `ParamProblem`, `DenyReason`).
schema = ["dep:schemars"]
ws-native = [
    "dep:futures-channel",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "futures-util/sink",
]
ws-web = ["dep:futures-channel", "dep:wasm-bindgen", "dep:web-sys"]

[dev-dependencies]
futures = "0.3"
tokio = { version = "1.0", features = ["macros", "rt"] }
